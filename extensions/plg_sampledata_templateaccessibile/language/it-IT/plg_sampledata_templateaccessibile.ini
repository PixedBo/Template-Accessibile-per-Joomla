PLG_SAMPLEDATA_TEMPLATEACCESSIBILE="Dati di esempio - Template Accessibile"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_XML_DESCRIPTION="Crea su un sito Joomla la struttura prevista dal Template Accessibile: categorie, campi personalizzati, menu, moduli e pagine. Oggi contiene i dati per il sito di un Comune (Modello Comuni di Designers Italia). Ogni blocco si installa dal modulo «Dati di esempio» del pannello di controllo e può essere rilanciato senza creare duplicati. Pensato per un sito nuovo o in costruzione: su un sito già pubblicato fai prima un backup, perché ciò che viene creato è subito visibile ai visitatori."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_CONFIG_NOTE_LABEL="Come si usa"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_CONFIG_NOTE_DESC="Non c'è nulla da configurare qui. Apri il pannello di controllo: nel modulo «Dati di esempio» trovi una voce per ogni blocco (Struttura, Menu e moduli, Pagine istituzionali, Campi DPCalendar, Contenuti dimostrativi). Installa quelli che ti servono, nell'ordine che preferisci. Rilanciare un blocco crea solo ciò che manca: gli elementi esistenti non vengono modificati né cancellati.<br><br><strong>Attenzione ai siti già pubblicati.</strong> I dati di esempio sono pensati per un sito nuovo o in costruzione. Menu, moduli, pagine e contenuti dimostrativi nascono pubblicati e sono subito visibili ai visitatori. Gli elementi esistenti sono riconosciuti dall'alias: una categoria o un menu che hai già, ma con un alias diverso, non viene riconosciuto e ne viene creato uno nuovo accanto. Su un sito pubblicato fai prima un backup."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_POSTINSTALL="Dati di esempio del Template Accessibile: plugin installato e abilitato. Apri il pannello di controllo e usa il modulo «Dati di esempio»."

; Voci nel modulo - profilo Comuni
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_STRUTTURA_TITLE="Sito di un Comune - Struttura"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_STRUTTURA_DESC="Per il sito di un Comune (Modello Comuni). Crea le categorie (Amministrazione, Novità, Servizi, Vivere il Comune con le sottocategorie), i campi personalizzati della Scheda Servizio e li associa nei parametri del template."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_MENU_TITLE="Sito di un Comune - Menu e moduli"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_MENU_DESC="Per il sito di un Comune (Modello Comuni). Crea il menu principale, secondario e del footer con le loro voci, i moduli che li mostrano e il percorso di navigazione, e collega le voci ai criteri di valutazione nei parametri del template. Se le categorie non esistono ancora le crea, come farebbe «Struttura». La pagina iniziale del sito non viene modificata. <strong>Su un sito già pubblicato:</strong> i menu compaiono subito nel sito; dove c'è già un menu pubblicato nella stessa posizione, il nuovo modulo viene creato sospeso."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_PAGINE_TITLE="Sito di un Comune - Pagine istituzionali"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_PAGINE_DESC="Per il sito di un Comune (Modello Comuni). Crea le pagine segnaposto: Note legali, Informativa privacy, Dichiarazione di accessibilità, Domande frequenti, Contatti, Prenotazione appuntamento, Segnalazione disservizio. Per vederle nel footer installa (o rilancia) «Menu e moduli»."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_DPCALENDAR_TITLE="Sito di un Comune - Campi DPCalendar"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_DPCALENDAR_DESC="Per il sito di un Comune (Modello Comuni). Crea i campi personalizzati degli eventi di DPCalendar usati dalla Scheda Evento (A chi è rivolto, Galleria, Video, Costi, Allegati, Contatti, Patrocinato da, Sponsor, Ulteriori informazioni) e li associa nei parametri del template."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_DEMO_TITLE="Sito di un Comune - Contenuti dimostrativi"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_DEMO_DESC="Per il sito di un Comune (Modello Comuni). Crea una scheda servizio compilata, una notizia, un avviso e un argomento, per vedere subito i layout. Se categorie e campi della Scheda Servizio non esistono ancora li crea e li associa, come farebbe «Struttura». I titoli iniziano con «Esempio:»: sono contenuti da cancellare su un sito reale. <strong>Su un sito già pubblicato:</strong> questi articoli sono pubblici e in evidenza appena creati."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_NOTE_PAGES_MISSING="%d pagine istituzionali non sono presenti: le relative voci del footer non sono state create. Installa «Pagine istituzionali» e rilancia «Menu e moduli»."

