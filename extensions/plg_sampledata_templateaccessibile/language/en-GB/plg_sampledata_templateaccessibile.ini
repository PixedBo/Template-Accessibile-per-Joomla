PLG_SAMPLEDATA_TEMPLATEACCESSIBILE="Sample Data - Template Accessibile"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_XML_DESCRIPTION="Creates on a Joomla site the structure expected by the Template Accessibile: categories, custom fields, menus, modules and pages. It currently ships the data for an Italian municipality website (Designers Italia «Modello Comuni»). Each block is installed from the «Sample Data» module on the dashboard and can be run again without creating duplicates. Meant for a new site or one under construction: on a published site take a backup first, because what is created is immediately visible to visitors."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_CONFIG_NOTE_LABEL="How to use it"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_CONFIG_NOTE_DESC="There is nothing to configure here. Open the dashboard: the «Sample Data» module lists one entry per block (Structure, Menus and modules, Institutional pages, DPCalendar fields, Demo content). Install the ones you need, in any order. Running a block again only creates what is missing: existing items are never changed or deleted.<br><br><strong>Mind published sites.</strong> The sample data is meant for a new site or one under construction. Menus, modules, pages and demo content are created published and are immediately visible to visitors. Existing items are recognised by their alias: a category or menu you already have under a different alias is not recognised, and a new one is created next to it. On a published site take a backup first."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_POSTINSTALL="Template Accessibile sample data: plugin installed and enabled. Open the dashboard and use the «Sample Data» module."

; Module entries - Municipality profile
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_STRUTTURA_TITLE="Municipality website - Structure"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_STRUTTURA_DESC="For an Italian municipality website (Modello Comuni). Creates the categories (Amministrazione, Novità, Servizi, Vivere il Comune and their subcategories), the custom fields of the service page and maps them in the template parameters. Titles are created in Italian, as required by the model."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_MENU_TITLE="Municipality website - Menus and modules"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_MENU_DESC="For an Italian municipality website (Modello Comuni). Creates the main, secondary and footer menus with their items, the modules that display them and the breadcrumbs, and links the items to the evaluation criteria in the template parameters. If the categories do not exist yet it creates them, as «Structure» would. The site home page is not changed. <strong>On a published site:</strong> the menus show up on the site straight away; where a published menu already sits in the same position, the new module is created unpublished."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_PAGINE_TITLE="Municipality website - Institutional pages"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_PAGINE_DESC="For an Italian municipality website (Modello Comuni). Creates the placeholder pages: legal notes, privacy policy, accessibility statement, FAQ, contacts, appointment booking, report a problem. To show them in the footer install (or run again) «Menus and modules»."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_DPCALENDAR_TITLE="Municipality website - DPCalendar fields"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_DPCALENDAR_DESC="For an Italian municipality website (Modello Comuni). Creates the DPCalendar event custom fields used by the event page (audience, gallery, video, costs, attachments, contacts, patronage, sponsors, further information) and maps them in the template parameters."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_DEMO_TITLE="Municipality website - Demo content"
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_DEMO_DESC="For an Italian municipality website (Modello Comuni). Creates a filled-in service page, a news item, a notice and a topic, so the layouts can be seen straight away. If the categories and the service page fields do not exist yet it creates and maps them, as «Structure» would. Titles start with «Esempio:»: delete this content on a real site. <strong>On a published site:</strong> these articles are public and featured as soon as they are created."
PLG_SAMPLEDATA_TEMPLATEACCESSIBILE_COMUNI_NOTE_PAGES_MISSING="%d institutional pages are missing: their footer menu items were not created. Install «Institutional pages» and run «Menus and modules» again."

