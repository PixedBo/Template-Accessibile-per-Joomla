; ========================================================
; SCHEDA SERVIZIO - BACKEND (templateDetails.xml)
; ========================================================
TPL_ACCESSIBILE_SCHEDA_SERVIZIO_NOTE_LABEL="Scheda Servizio (C.SI.1.3)"
TPL_ACCESSIBILE_SCHEDA_SERVIZIO_NOTE_DESC="Associa i Custom Field di Joomla agli elementi della Scheda Servizio (C.SI.1.3). Vai in <strong>Contenuto &rarr; Gruppo di campi</strong>, crea un gruppo per i servizi (es. Servizi) e poi in <strong>Contenuto &rarr; Campi aggiuntivi</strong> aggiungi i seguenti campi (context: Articolo):<br><br><strong>1. Stato del servizio</strong> &mdash; tipo <em>Radio button</em> (Con le opzioni: Servizio attivo &rarr; 1, Servizio non attivo &rarr; 0)<br><strong>2. Motivo stato servizio</strong> &mdash; tipo <em>Textarea</em> (Attributo visibilità condizionata &rarr; stato-del-servizio:no)<br><strong>3. A chi &egrave; rivolto</strong> &mdash; tipo <em>Editor</em><br><strong>4. Come fare</strong> &mdash; tipo <em>Editor</em><br><strong>5. Cosa serve</strong> &mdash; tipo <em>Editor</em><br><strong>6. Cosa si ottiene</strong> &mdash; tipo <em>Editor</em><br><strong>7. Tempi e scadenze</strong> &mdash; tipo <em>Textarea</em><br><strong>8. Quanto costa</strong> &mdash; tipo <em>Editor</em> o <em>Textarea</em><br><strong>8. Accedi al servizio (testo)</strong> &mdash; tipo <em>Testo</em><br><strong>10. URL accesso online</strong> &mdash; tipo <em>URL</em><br><strong>11. URL prenotazione appuntamento</strong> &mdash; tipo <em>URL</em><br><strong>12. URL condizioni di servizio</strong> &mdash; tipo <em>URL</em><br><strong>13. Contatti - unit&agrave; organizzativa</strong> &mdash; tipo <em>Editor</em> o <em>Textarea</em><br><br>Una volta creati, seleziona ciascun campo nel menu a tendina corrispondente qui sotto."
TPL_ACCESSIBILE_CF_STATO_LABEL="Campo: Stato del servizio"
TPL_ACCESSIBILE_CF_STATO_DESC="Custom field che indica lo stato del servizio (es.: Servizio attivo / Servizio non attivo). Corrisponde a data-element=service-status."
TPL_ACCESSIBILE_CF_MOTIVO_STATO_SERVIZIO_LABEL="Campo: Motivo stato servizio"
TPL_ACCESSIBILE_CF_MOTIVO_STATO_SERVIZIO_DESC="Custom field che mostra un messaggio personalizzato quando il servizio non e attivo"
TPL_ACCESSIBILE_CF_A_CHI_RIVOLTO_LABEL="Campo: A chi è rivolto"
TPL_ACCESSIBILE_CF_A_CHI_RIVOLTO_DESC="Custom field con il testo della sezione A chi è rivolto (service-addressed). Consigliato: tipo Editor o Textarea."
TPL_ACCESSIBILE_CF_COME_FARE_LABEL="Campo: Come fare"
